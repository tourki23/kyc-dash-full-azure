# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - kyc-API-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: registrykycmahmoud.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_388299C5D6834FEF8392F38EE3335FBC }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_D4D47C58834E4B0996F82DABCE2ED2A2 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: registrykycmahmoud.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_388299C5D6834FEF8392F38EE3335FBC }}/kyc-backend:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EF5122A4A99248EEAD6C9C521DF765F2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B6DDD301DF2A4358A4FD3439F9A90A9D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B9FE4CE729CE4B7DB169F99A57D8CB38 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'kyc-API-backend'
          slot-name: 'Production'
          images: 'registrykycmahmoud.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_388299C5D6834FEF8392F38EE3335FBC }}/kyc-backend:${{ github.sha }}'
          